[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace"
version = "0.1.0"
description = "Trace — The Provenance-First AI Content Engine. Every AI-generated creator asset, provenance-tagged in one click."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trace Contributors" }]
keywords = ["c2pa", "provenance", "ai-content", "eu-ai-act", "compliance", "content-authenticity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "c2pa-python==0.37.10",
    "cryptography>=41.0.0,<51.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "python-multipart>=0.0.12,<0.1.0",
    "jinja2>=3.1.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "httpx>=0.27.0,<0.29.0",
]

[project.scripts]
# CLI command stays `trace` (report Sec 25.2); the import package is `tracekit`
# to avoid shadowing Python's stdlib `trace` module (see ARCHITECTURE.md).
trace = "tracekit.cli:main"

[project.urls]
Homepage = "https://github.com/sodiq-code/trace"
Repository = "https://github.com/sodiq-code/trace"

# --- Package mapping --------------------------------------------------------
# The source directory is `python/trace/` (matching report Sec 30.1), but it is
# importable as `tracekit` so it never collides with the stdlib `trace` module.
# Relative imports inside the package are unaffected by this rename.
[tool.setuptools]
package-dir = { "tracekit" = "python/trace" }
packages = ["tracekit"]

[tool.setuptools.package-data]
tracekit = ["credentials/*.pem", "credentials/*.key", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
